<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="100%" height="100%">
  <defs>
    <linearGradient id="philBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="50%" stop-color="#f3eee8" />
      <stop offset="100%" stop-color="#eae3da" />
    </linearGradient>
    <linearGradient id="stoneCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f1eb" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#78716c" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#philBg)" />

  <!-- Swiss grid background overlay -->
  <g opacity="0.15" stroke="#a8a29e" stroke-width="0.8">
    <line x1="80" y1="0" x2="80" y2="800" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="560" y1="0" x2="560" y2="800" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="0" y1="440" x2="640" y2="440" />
    <line x1="0" y1="600" x2="640" y2="600" />
    <line x1="0" y1="720" x2="640" y2="720" />
  </g>

  <!-- Architectural Composition Centerpiece -->
  <g transform="translate(80, 100)" filter="url(#softShadow)">
    <rect width="480" height="600" rx="24" fill="url(#stoneCard)" stroke="#e7e0d6" stroke-width="1.5" />

    <!-- Minimalist sculptural arches & geometry -->
    <g transform="translate(60, 60)">
      <!-- Monolith pillar 1 -->
      <rect x="0" y="80" width="100" height="340" rx="50" fill="#292524" />
      <!-- Monolith pillar 2 with arch cutout -->
      <rect x="130" y="140" width="100" height="280" rx="50" fill="#d69e9e" opacity="0.85" />
      <!-- Arch circle balance -->
      <circle cx="310" cy="220" r="60" fill="#78716c" opacity="0.35" />
      <!-- Fine brass balance ring -->
      <circle cx="310" cy="220" r="80" stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.6" />
      <line x1="0" y1="420" x2="360" y2="420" stroke="#1c1917" stroke-width="2" />
    </g>

    <!-- Typography annotations -->
    <text x="60" y="520" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="2">SWISS RESTRAINT · FORM FOLLOWS FUNCTION</text>
    <text x="60" y="546" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#1c1917">Code as silent utility</text>
    <text x="60" y="568" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#a8a29e">Sub-second execution · Zero superfluous motion</text>
  </g>
</svg>
