<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#CE6A73" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- Shield Badge -->
  <polygon points="100,12 180,45 180,135 100,190 20,135 20,45" fill="#1C1427" stroke="url(#dlGrad)" stroke-width="4" stroke-linejoin="round" />
  <!-- Neural Nodes -->
  <g transform="translate(100,75)">
    <line x1="-30" y1="-15" x2="0" y2="-20" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    <line x1="-30" y1="-15" x2="0" y2="20" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    <line x1="-30" y1="15" x2="0" y2="-20" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    <line x1="-30" y1="15" x2="0" y2="20" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="-20" x2="30" y2="0" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="20" x2="30" y2="0" stroke="#CE6A73" stroke-width="1.5" opacity="0.6" />
    
    <circle cx="-30" cy="-15" r="5" fill="#FF5252" />
    <circle cx="-30" cy="15" r="5" fill="#FF5252" />
    <circle cx="0" cy="-20" r="6" fill="#CE6A73" />
    <circle cx="0" cy="20" r="6" fill="#CE6A73" />
    <circle cx="30" cy="0" r="7" fill="#A78BFA" />
  </g>
  <!-- Text -->
  <text x="100" y="125" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">DEEP LEARNING</text>
  <text x="100" y="142" text-anchor="middle" fill="#CE6A73" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">Specialization</text>
  <text x="100" y="158" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">DEEPLEARNING.AI</text>
</svg>
