<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="novaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#120c29" />
      <stop offset="100%" stop-color="#070314" />
    </linearGradient>
    <linearGradient id="novaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="novaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#novaBg)" />

  <!-- Background radial glow -->
  <circle cx="400" cy="240" r="240" fill="#7c3aed" opacity="0.12" filter="blur(70px)" />
  <circle cx="680" cy="400" r="180" fill="#06b6d4" opacity="0.08" filter="blur(60px)" />

  <!-- Mockup frame -->
  <g transform="translate(60, 45)" filter="url(#novaShadow)">
    <rect width="680" height="460" rx="16" fill="#0f0926" stroke="#2e1065" stroke-width="1.2" />

    <!-- Terminal header -->
    <rect width="680" height="46" rx="16" fill="#170d38" />
    <rect y="32" width="680" height="14" fill="#170d38" />
    <circle cx="24" cy="23" r="5" fill="#f43f5e" opacity="0.7" />
    <circle cx="42" cy="23" r="5" fill="#fbbf24" opacity="0.7" />
    <circle cx="60" cy="23" r="5" fill="#10b981" opacity="0.7" />
    <text x="96" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing="1">NOVA CLUSTER / TELEMETRY DECK</text>
    <rect x="530" y="14" width="120" height="18" rx="9" fill="#2e1065" />
    <circle cx="544" cy="23" r="3.5" fill="#10b981" />
    <text x="556" y="27" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#34d399">CLUSTER HEALTHY</text>

    <!-- Node Network Visual Centerpiece -->
    <g transform="translate(24, 66)">
      <rect width="400" height="370" rx="12" fill="#140c33" stroke="#2e1065" stroke-width="0.8" />
      
      <!-- Network connections -->
      <g stroke="#6d28d9" stroke-width="1.5" opacity="0.5">
        <line x1="80" y1="90" x2="190" y2="160" />
        <line x1="190" y1="160" x2="310" y2="100" />
        <line x1="190" y1="160" x2="160" y2="280" />
        <line x1="190" y1="160" x2="270" y2="250" />
        <line x1="310" y1="100" x2="330" y2="210" />
        <line x1="80" y1="90" x2="60" y2="220" />
        <line x1="60" y1="220" x2="160" y2="280" />
        <line x1="270" y1="250" x2="340" y2="310" />
      </g>

      <!-- Network Nodes -->
      <g>
        <circle cx="190" cy="160" r="28" fill="#7c3aed" opacity="0.3" />
        <circle cx="190" cy="160" r="14" fill="#a855f7" />
        <text x="190" y="164" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">CORE</text>

        <circle cx="80" cy="90" r="12" fill="#06b6d4" />
        <circle cx="310" cy="100" r="14" fill="#3b82f6" />
        <circle cx="60" cy="220" r="10" fill="#ec4899" />
        <circle cx="160" cy="280" r="13" fill="#10b981" />
        <circle cx="270" cy="250" r="15" fill="#f59e0b" />
        <circle cx="330" cy="210" r="11" fill="#8b5cf6" />
        <circle cx="340" cy="310" r="9" fill="#06b6d4" />
      </g>

      <text x="24" y="342" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">DISTRIBUTED TOPOLOGY</text>
      <text x="24" y="356" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#a78bfa">64 Nodes across 8 Edge Regions</text>
    </g>

    <!-- Right Side Telemetry Rails -->
    <g transform="translate(442, 66)">
      <!-- Panel 1 -->
      <rect width="214" height="114" rx="12" fill="#140c33" stroke="#2e1065" stroke-width="0.8" />
      <text x="18" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">EVENT INGESTION</text>
      <text x="18" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2.84M / s</text>
      <!-- Bars -->
      <g transform="translate(18, 72)" fill="#8b5cf6">
        <rect x="0" y="16" width="12" height="18" rx="3" fill="#6d28d9" />
        <rect x="18" y="8" width="12" height="26" rx="3" fill="#7c3aed" />
        <rect x="36" y="2" width="12" height="32" rx="3" fill="#8b5cf6" />
        <rect x="54" y="12" width="12" height="22" rx="3" fill="#a855f7" />
        <rect x="72" y="0" width="12" height="34" rx="3" fill="#c084fc" />
        <rect x="90" y="10" width="12" height="24" rx="3" fill="#8b5cf6" />
        <rect x="108" y="4" width="12" height="30" rx="3" fill="#a855f7" />
        <rect x="126" y="14" width="12" height="20" rx="3" fill="#7c3aed" />
        <rect x="144" y="8" width="12" height="26" rx="3" fill="#8b5cf6" />
        <rect x="162" y="2" width="12" height="32" rx="3" fill="#c084fc" />
      </g>

      <!-- Panel 2 -->
      <g transform="translate(0, 128)">
        <rect width="214" height="242" rx="12" fill="#140c33" stroke="#2e1065" stroke-width="0.8" />
        <text x="18" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">KAFKA PIPELINE STATUS</text>
        
        <g transform="translate(18, 50)">
          <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#e9d5ff">partition-01</text>
          <text x="178" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">99.9%</text>
          <rect y="22" width="178" height="6" rx="3" fill="#2e1065" />
          <rect y="22" width="176" height="6" rx="3" fill="#10b981" />

          <text x="0" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#e9d5ff">partition-02</text>
          <text x="178" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">98.4%</text>
          <rect y="62" width="178" height="6" rx="3" fill="#2e1065" />
          <rect y="62" width="172" height="6" rx="3" fill="#10b981" />

          <text x="0" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#e9d5ff">partition-03</text>
          <text x="178" y="94" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">SYNCING</text>
          <rect y="102" width="178" height="6" rx="3" fill="#2e1065" />
          <rect y="102" width="140" height="6" rx="3" fill="#38bdf8" />

          <text x="0" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#e9d5ff">p99 response</text>
          <text x="178" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="end">0.82ms</text>
          <rect y="142" width="178" height="6" rx="3" fill="#2e1065" />
          <rect y="142" width="168" height="6" rx="3" fill="#c084fc" />
        </g>
      </g>
    </g>
  </g>
</svg>
