<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="aetherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="aetherShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#aetherBg)" />

  <!-- Ambient glowing spheres -->
  <circle cx="280" cy="200" r="160" fill="#3b82f6" opacity="0.12" filter="blur(60px)" />
  <circle cx="560" cy="340" r="180" fill="#ec4899" opacity="0.1" filter="blur(70px)" />

  <g transform="translate(60, 45)" filter="url(#aetherShadow)">
    <!-- Main Desktop Container -->
    <rect width="680" height="460" rx="20" fill="#090d16" stroke="#374151" stroke-width="1" />

    <!-- Top Status bar -->
    <rect width="680" height="34" rx="20" fill="#131b2e" />
    <rect y="20" width="680" height="14" fill="#131b2e" />
    <text x="24" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#e5e7eb" letter-spacing="1.5">AETHER OS</text>
    <text x="120" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#9ca3af">Workspace 01</text>
    <text x="640" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="end">10:42 AM · 60 FPS</text>

    <!-- Floating Window 1: Spatial Canvas Editor -->
    <g transform="translate(36, 56)">
      <rect width="380" height="290" rx="14" fill="url(#glass)" stroke="#4b5563" stroke-width="1" />
      <rect width="380" height="36" rx="14" fill="#1f2937" opacity="0.8" />
      <rect y="24" width="380" height="12" fill="#1f2937" opacity="0.8" />
      <circle cx="20" cy="18" r="4" fill="#ef4444" />
      <circle cx="34" cy="18" r="4" fill="#f59e0b" />
      <circle cx="48" cy="18" r="4" fill="#10b981" />
      <text x="70" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">Spatial_Geometry.rs</text>

      <!-- Geometry art inside editor -->
      <g transform="translate(190, 160)" stroke="#60a5fa" stroke-width="1.5" fill="none">
        <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" opacity="0.8" />
        <polygon points="0,-50 42,-25 42,25 0,50 -42,25 -42,-25" stroke="#f472b6" opacity="0.6" />
        <circle cx="0" cy="0" r="24" stroke="#a78bfa" />
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#93c5fd" opacity="0.4" />
        <line x1="-60" y1="-35" x2="60" y2="35" stroke="#93c5fd" opacity="0.4" />
        <line x1="-60" y1="35" x2="60" y2="-35" stroke="#93c5fd" opacity="0.4" />
      </g>
      <text x="24" y="266" font-family="monospace" font-size="9" fill="#9ca3af">render_frame(canvas, &amp;mesh);</text>
    </g>

    <!-- Floating Window 2: Inspector / WASM Profiler -->
    <g transform="translate(436, 56)">
      <rect width="210" height="290" rx="14" fill="url(#glass)" stroke="#4b5563" stroke-width="1" />
      <rect width="210" height="36" rx="14" fill="#1f2937" opacity="0.8" />
      <rect y="24" width="210" height="12" fill="#1f2937" opacity="0.8" />
      <text x="20" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">WASM Memory</text>

      <g transform="translate(20, 56)">
        <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#9ca3af">ALLOCATED HEAP</text>
        <text x="0" y="34" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f9fafb">18.4 MB</text>
        
        <text x="0" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#9ca3af">FRAME TIME</text>
        <text x="0" y="90" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34d399">1.12 ms</text>

        <text x="0" y="126" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#9ca3af">GPU DRAW CALLS</text>
        <text x="0" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#60a5fa">12 / pass</text>

        <rect y="170" width="170" height="36" rx="8" fill="#374151" opacity="0.6" />
        <text x="24" y="192" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#f3f4f6">Zero-Copy Buffer: ON</text>
      </g>
    </g>

    <!-- Floating Dock at Bottom -->
    <g transform="translate(190, 380)">
      <rect width="300" height="54" rx="27" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <g transform="translate(22, 10)">
        <rect x="0" y="0" width="34" height="34" rx="10" fill="#3b82f6" />
        <rect x="52" y="0" width="34" height="34" rx="10" fill="#ec4899" />
        <rect x="104" y="0" width="34" height="34" rx="10" fill="#10b981" />
        <rect x="156" y="0" width="34" height="34" rx="10" fill="#f59e0b" />
        <rect x="208" y="0" width="34" height="34" rx="10" fill="#8b5cf6" />
      </g>
    </g>
  </g>
</svg>
