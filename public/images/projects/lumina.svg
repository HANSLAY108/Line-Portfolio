<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800M0 450h800M0 500h800" />
    <path d="M50 0v550M100 0v550M150 0v550M200 0v550M250 0v550M300 0v550M350 0v550M400 0v550M450 0v550M500 0v550M550 0v550M600 0v550M650 0v550M700 0v550M750 0v550" />
  </g>

  <!-- Ambient light -->
  <circle cx="680" cy="120" r="180" fill="#10b981" opacity="0.08" filter="blur(50px)" />
  <circle cx="160" cy="400" r="200" fill="#6366f1" opacity="0.07" filter="blur(60px)" />

  <!-- Dashboard Window -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="680" height="460" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />

    <!-- Top Window Bar -->
    <rect width="680" height="44" rx="16" fill="#1f2937" />
    <rect y="30" width="680" height="14" fill="#1f2937" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <rect x="90" y="14" width="180" height="16" rx="6" fill="#374151" opacity="0.6" />
    <text x="100" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="1">LUMINA / ANALYTICS</text>

    <!-- Stat Card 1 -->
    <g transform="translate(24, 64)">
      <rect width="198" height="90" rx="12" fill="#1f2937" stroke="#374151" stroke-width="0.8" />
      <text x="16" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.5">NET LIQUIDITY</text>
      <text x="16" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f9fafb">$14.28M</text>
      <rect x="16" y="68" width="58" height="14" rx="4" fill="#065f46" opacity="0.4" />
      <text x="22" y="79" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#34d399">+18.4%</text>
    </g>

    <!-- Stat Card 2 -->
    <g transform="translate(241, 64)">
      <rect width="198" height="90" rx="12" fill="#1f2937" stroke="#374151" stroke-width="0.8" />
      <text x="16" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.5">ACTIVE HEDGES</text>
      <text x="16" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f9fafb">94.8%</text>
      <rect x="16" y="68" width="58" height="14" rx="4" fill="#065f46" opacity="0.4" />
      <text x="22" y="79" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#34d399">STABLE</text>
    </g>

    <!-- Stat Card 3 -->
    <g transform="translate(458, 64)">
      <rect width="198" height="90" rx="12" fill="#1f2937" stroke="#374151" stroke-width="0.8" />
      <text x="16" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.5">LATENCY P99</text>
      <text x="16" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f9fafb">1.4ms</text>
      <rect x="16" y="68" width="58" height="14" rx="4" fill="#1e3a8a" opacity="0.4" />
      <text x="22" y="79" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#60a5fa">GLOBAL</text>
    </g>

    <!-- Main Chart Card -->
    <g transform="translate(24, 172)">
      <rect width="632" height="264" rx="12" fill="#1f2937" stroke="#374151" stroke-width="0.8" />
      <text x="20" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f3f4f6">REAL-TIME SETTLEMENT VOLUME</text>
      <text x="20" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#9ca3af">Streaming 2.4k transactions / sec</text>

      <!-- Chart grid lines -->
      <path d="M20 90h592M20 140h592M20 190h592M20 240h592" stroke="#374151" stroke-width="0.6" stroke-dasharray="4 4" />

      <!-- Area Chart -->
      <path d="M20 220 C 80 180, 120 210, 180 160 C 240 110, 280 170, 340 120 C 400 70, 460 130, 520 90 C 560 60, 590 85, 612 70 L 612 240 L 20 240 Z" fill="url(#chartFill)" />
      <path d="M20 220 C 80 180, 120 210, 180 160 C 240 110, 280 170, 340 120 C 400 70, 460 130, 520 90 C 560 60, 590 85, 612 70" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round" />

      <!-- Glowing Data Points -->
      <circle cx="340" cy="120" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <circle cx="520" cy="90" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
      <circle cx="612" cy="70" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>
</svg>
